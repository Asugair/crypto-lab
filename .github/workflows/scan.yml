name: crypto-lab scan
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5,9,13,17 * * *"   # 08:00 / 12:00 / 16:00 / 20:00 Riyadh. Delete this block after 2026-09-30.
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: offline logic tests
        run: bash tests/run_tests.sh
      - name: run cycle
        run: bash run.sh
      - name: commit results
        run: |
          git config user.name "crypto-lab-bot"; git config user.email "bot@users.noreply.github.com"
          mkdir -p data/history && cp data/latest.json "data/history/$(date -u +%Y%m%dT%H%M)Z.json"
          git add data && git commit -m "scan $(date -u +%FT%TZ)" || echo "no changes"
          git push
